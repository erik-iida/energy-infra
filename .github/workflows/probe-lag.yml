name: probe-lag

# One-off: A75 publication lag per zone with the collector parser; commits its log.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/probe_lag.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-collect.txt
      - env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/probe_lag.py || true
      - run: |
          git config user.name "wake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/entsoe/probe_lag_log.txt
          git commit -m "ENTSO-E A75 lag probe log" || echo "no changes"
          git pull --rebase
          git push
