name: hourly-feed

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (off the hour, when Actions is less busy)
    - cron: "37 * * * *"  # second slot: GitHub often drops scheduled runs; forecasts are cached, so no extra API calls
  workflow_dispatch:       # "Run workflow" button for manual runs
  push:
    branches: [main]       # redeploy straight away when code changes
  workflow_run:            # and when a data job has committed new data (bot commits don't trigger push events)
    workflows: [gas, grid, osm-world, bathymetry, global-turbines, extra-turbines, capture]
    types: [completed]

# never run two at once, so a delayed run can't double the API calls
concurrency:
  group: hourly-feed
  cancel-in-progress: false

permissions:
  contents: write   # collector/farms.py uploads farm wind + wake output to the "store" release
  pages: write
  id-token: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - if: ${{ vars.WM_SOURCE == 'ecmwf' }}
        run: pip install -r requirements-ecmwf.txt

      # state/ holds the forecast cache, the 24 h history and the daily call counter.
      # It lives in the Actions cache instead of git, so the repo doesn't grow every hour.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run pipeline
        env:
          WM_SOURCE: ${{ vars.WM_SOURCE || 'openmeteo' }}
          WM_OPENMETEO_MODEL: ${{ vars.WM_OPENMETEO_MODEL || 'ecmwf_ifs' }}
          WM_WINDY_MODEL: ${{ vars.WM_WINDY_MODEL || 'iconEu' }}
          WM_DAILY_CALL_CAP: ${{ vars.WM_DAILY_CALL_CAP || '3000' }}
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          COLLECT_FARMS: "1"
          GH_TOKEN: ${{ github.token }}
          SPARK: ${{ vars.SPARK }}   # "private" (login-protected site only) or "public"; empty = off (pipeline/spark.py)
        run: python -m pipeline.run

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: state-${{ github.run_id }}

      # Data tab: last 30 days of the data store as small JSON files (scripts/build_browse.py). Rebuilt every 3 h
      # (cached in between so the hourly runs don't download the store each time); a failure only hides the tab's data.
      - id: bucket
        run: echo "k=$(date -u +%Y%m%d)-$(( $(date -u +%-H) / 3 ))" >> "$GITHUB_OUTPUT"
      - id: browsecache
        uses: actions/cache@v4
        with:
          path: |
            web/data/browse
            web/data/newsletter
          key: browse-${{ steps.bucket.outputs.k }}-${{ hashFiles('scripts/build_browse.py', 'scripts/build_newsletter_site.py', 'newsletter/*.py', 'newsletter/editorial/*') }}
      - name: Export store for the Data tab
        if: steps.browsecache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_browse.py
      # Newsletter tab: the daily draft(s) for the last 3 CET days, no fuel prices (public site). newsletter/editorial/<day>.md overrides the generated text.
      - name: Build the Newsletter tab drafts
        if: steps.browsecache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_newsletter_site.py --days 3
      # continue-on-error hides a failed export, and the 3-hour cache would then keep an empty Data tab until the next bucket:
      # drop incomplete output so it is neither deployed from cache nor saved to it
      - name: Drop an incomplete Data tab export
        if: steps.browsecache.outputs.cache-hit != 'true'
        run: |
          if [ ! -s web/data/browse/index.json ]; then
            echo "::warning::Data tab export failed; not caching it"
            rm -rf web/data/browse web/data/newsletter
          fi

      # data/meta.json: build time, schema version and newest data point per file (docs/DATA_CONTRACT.md); never fails
      - name: Data freshness (meta.json)
        run: python scripts/build_meta.py || echo "::warning::meta.json not written"

      # CARTO raster basemaps: the key is client-side by nature (it ends up in the served page) but stays out of the repo:
      # written in place of __CARTO_KEY__ from the CARTO_KEY secret. Without the secret the page falls back to keyless tiles.
      - name: Basemap key (CARTO)
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: |
          if [ -n "$CARTO_KEY" ]; then sed -i "s/__CARTO_KEY__/${CARTO_KEY}/g" web/index.html; echo "CARTO key set";
          else echo "::warning::CARTO_KEY secret not set: CARTO basemaps show the API-key watermark"; fi

      # Private site: a full copy incl. data that must not be public (spark spreads). Public Pages build gets it stripped.
      - name: Split public / private site
        env:
          SPARK: ${{ vars.SPARK }}
        run: python scripts/split_private.py
      - name: Deploy private site (Cloudflare Pages, behind Cloudflare Access)
        if: ${{ env.CF_TOKEN != '' && vars.SPARK == 'private' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_private --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
