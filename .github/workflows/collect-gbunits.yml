name: collect-gbunits

# Great Britain per-unit output (Elexon B1610), BM-unit registry and REPD sites into the data store; no keys (collector/gbunits.py).
#   daily     13:10 UTC: registry + REPD refresh, last 15 days of unit output
#   backfill  every 2 h: whole months from BACKFILL_FROM, newest first, until done (state in gbunits_state.json)
on:
  schedule:
    - cron: "10 13 * * *"
    - cron: "40 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or backfill"
        default: daily

permissions:
  contents: write   # upload release assets

# own lock: writes only its own datasets (not the ENTSO-E assets), so it must not queue behind the ENTSO-E backfill
concurrency:
  group: store-gbopen
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-collect.txt
      - run: pip install -r requirements-collect.txt
      - name: Collect GB unit output
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL_FROM: ${{ vars.BACKFILL_FROM || '2024-01' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '10 13 * * *' && 'daily' || 'backfill') }}
        run: python -m collector.gbunits "$MODE"
