name: collect-gbhist

# Great Britain history since 2009 (NESO mix, carbon intensity, demand) and day-ahead forecasts into the data store; no keys (collector/gbhist.py).
#   daily     14:20 UTC: last 14 days of history, today's forecasts
#   backfill  every 6 h until done: full NESO history and the day-ahead wind forecast archive (state in gbhist_state.json)
on:
  schedule:
    - cron: "20 14 * * *"
    - cron: "50 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or backfill"
        default: daily

permissions:
  contents: write   # upload release assets

# own lock: writes only its own datasets (not the ENTSO-E assets), so it must not queue behind the ENTSO-E backfill
concurrency:
  group: store-gbopen
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-collect.txt
      - run: pip install -r requirements-collect.txt
      - name: Collect GB history and forecasts
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL_FROM: ${{ vars.BACKFILL_FROM || '2024-01' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '20 14 * * *' && 'daily' || 'backfill') }}
        run: |
          set -o pipefail
          python -m collector.gbhist "$MODE" 2>&1 | tee /tmp/run.log
      - name: Keep the log of this run (manual runs and failures)
        if: always() && (failure() || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p data/raw/gbie
          tail -n 150 /tmp/run.log > data/raw/gbie/last_run_gbhist.txt || true
          git config user.name "wake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/gbie/last_run_gbhist.txt
          git commit -m "gbhist run log" || echo "no changes"
          git pull --rebase
          git push
