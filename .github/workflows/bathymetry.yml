name: bathymetry

# Fetch the coarse EMODnet depth grid for the map underlay and commit it. Runs when the script changes, or manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_bathymetry.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6   # uv installs the requirements in seconds (pip took ~30 s)
        with:
          enable-cache: false
      - run: uv pip install --system requests numpy pillow tifffile
      - run: python scripts/fetch_bathymetry.py || true
      - name: Commit
        run: |
          git config user.name "wake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/bathy_log.txt
          git add data/static/bathy.png data/static/bathy.json 2>/dev/null || true
          git commit -m "Update EMODnet bathymetry grid" || echo "no changes"
          git pull --rebase
          git push
