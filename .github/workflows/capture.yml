name: capture

# Monthly capture prices per technology and BESS spreads (TB2/TB4) per bidding zone from ENTSO-E
# -> web/data/capture.json. Resumable: runs every 3 hours, refreshes the current month once a day.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */3 * * *"
  push:
    branches: [main]
    paths: [scripts/fetch_capture.py]

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/fetch_capture.py || true
      - name: Commit
        run: |
          git config user.name "wake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/capture/cells.json 2>/dev/null || true
          git add data/raw/capture/capture_log.txt 2>/dev/null || true
          git add web/data/capture.json 2>/dev/null || true
          git add data/fx.json 2>/dev/null || true
          git commit -m "Capture prices per technology (ENTSO-E)" || echo "no changes"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
