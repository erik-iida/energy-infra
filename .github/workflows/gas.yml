name: gas

# Daily gas flows from the ENTSOG Transparency Platform (public API) -> data/raw/gas, web/data/gas.json
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
    paths: [scripts/fetch_gas.py, scripts/fetch_gie.py]

permissions:
  contents: write

jobs:
  gas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6   # uv installs the requirements in seconds (pip took ~30 s)
        with:
          enable-cache: false
      - run: uv pip install --system requests numpy
      - run: python scripts/fetch_gas.py || true
      - name: GIE storage and LNG
        env:
          GIE_KEY: ${{ secrets.GIE_KEY }}
        run: python scripts/fetch_gie.py || true
      - name: Commit
        run: |
          git config user.name "wake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/gas 2>/dev/null || true
          git add web/data/gas.json 2>/dev/null || true
          git add data/raw/gie/gie_log.txt data/raw/gie/agsi_about.json data/raw/gie/alsi_about.json 2>/dev/null || true
          git add web/data/gie.json 2>/dev/null || true
          git commit -m "Gas flows from ENTSOG" || echo "no changes"
          git pull --rebase
          git push
