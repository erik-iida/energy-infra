name: collect-gbunits

# Great Britain per-unit output (Elexon B1610), BM-unit registry and REPD sites into the data store; no keys (collector/gbunits.py).
#   daily     13:10 UTC: registry + REPD refresh, last 15 days of unit output
#   backfill  every 2 h: whole months from BACKFILL_FROM, newest first, until done (state in gbunits_state.json)
on:
  schedule:
    - cron: "10 13 * * *"
    - cron: "40 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or backfill"
        default: daily

permissions:
  contents: write   # upload release assets

# own lock: writes only its own datasets (not the ENTSO-E assets), so it must not queue behind the ENTSO-E backfill
concurrency:
  group: store-gbopen
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6   # uv installs the requirements in seconds (pip took ~30 s)
        with:
          enable-cache: false
      - run: uv pip install --system -r requirements-collect.txt
      - name: Collect GB unit output
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL_FROM: ${{ vars.BACKFILL_FROM || '2024-01' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '10 13 * * *' && 'daily' || 'backfill') }}
        run: |
          set -o pipefail
          python -m jobs.collect gb-units "$MODE" 2>&1 | tee /tmp/run.log
      - name: Keep the log of this run (manual runs and failures)
        if: always() && (failure() || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p data/raw/gbie
          tail -n 150 /tmp/run.log > data/raw/gbie/last_run_gbunits.txt || true
          git config user.name "wake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/gbie/last_run_gbunits.txt
          git commit -m "gbunits run log" || echo "no changes"
          git pull --rebase
          git push
