name: osm-world

# Fetch offshore wind turbines outside Europe and (demo) Estonian onshore turbines from OpenStreetMap; commit
# the raw JSON. Runs when the script changes, or manually. build_site.py turns it into farms (run locally).
on:
  schedule:
    - cron: "40 */2 * * *"   # resumes until every part is fetched, then each run exits at once
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_osm_world.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6   # uv installs the requirements in seconds (pip took ~30 s)
        with:
          enable-cache: false
      - run: uv pip install --system requests shapely
      - name: Fetch (resumable; a timed-out run still commits what it has, the next run continues)
        run: python -m jobs.collect osm-world
        timeout-minutes: 45
        continue-on-error: true
      - name: Rebuild site.json
        run: python -m jobs.collect site
      - name: Commit
        run: |
          git config user.name "wake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/osm/osm_wind_log.txt 2>/dev/null || true
          git add data/raw/osm/osm_wind.json data/static/site.json 2>/dev/null || true
          git commit -m "OpenStreetMap wind turbines (offshore outside Europe, Estonia onshore)" || echo "no changes"
          git pull --rebase
          git push
