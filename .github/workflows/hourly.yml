name: hourly-feed

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (off the hour, when Actions is less busy)
  workflow_dispatch:       # "Run workflow" button for manual runs
  push:
    branches: [main]       # redeploy straight away when code changes

# never run two at once, so a delayed run can't double the API calls
concurrency:
  group: hourly-feed
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - if: ${{ vars.WM_SOURCE == 'ecmwf' }}
        run: pip install -r requirements-ecmwf.txt

      # state/ holds the forecast cache, the 24 h history and the daily call counter.
      # It lives in the Actions cache instead of git, so the repo doesn't grow every hour.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run pipeline
        env:
          WM_SOURCE: ${{ vars.WM_SOURCE || 'openmeteo' }}
          WM_OPENMETEO_MODEL: ${{ vars.WM_OPENMETEO_MODEL || 'ecmwf_ifs025' }}
          WM_WINDY_MODEL: ${{ vars.WM_WINDY_MODEL || 'iconEu' }}
          WM_DAILY_CALL_CAP: ${{ vars.WM_DAILY_CALL_CAP || '2000' }}
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
        run: python -m pipeline.run

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: state-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
