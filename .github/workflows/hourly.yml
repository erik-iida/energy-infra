name: hourly-feed

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (off the hour, when Actions is less busy)
    - cron: "37 * * * *"  # second slot: GitHub often drops scheduled runs; forecasts are cached, so no extra API calls
  workflow_dispatch:       # "Run workflow" button for manual runs
  push:
    branches: [main]       # redeploy straight away when code changes
  workflow_run:            # and when a data job has committed new data (bot commits don't trigger push events)
    workflows: [gas, grid, osm-world, bathymetry, global-turbines, extra-turbines, capture]
    types: [completed]

# never run two at once, so a delayed run can't double the API calls
concurrency:
  group: hourly-feed
  cancel-in-progress: false

permissions:
  contents: write   # collector/farms.py uploads farm wind + wake output to the "store" release
  pages: write
  id-token: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - if: ${{ vars.WM_SOURCE == 'ecmwf' }}
        run: pip install -r requirements-ecmwf.txt

      # state/ holds the forecast cache, the 24 h history and the daily call counter.
      # It lives in the Actions cache instead of git, so the repo doesn't grow every hour.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run pipeline
        env:
          WM_SOURCE: ${{ vars.WM_SOURCE || 'openmeteo' }}
          WM_OPENMETEO_MODEL: ${{ vars.WM_OPENMETEO_MODEL || 'ecmwf_ifs' }}
          WM_WINDY_MODEL: ${{ vars.WM_WINDY_MODEL || 'iconEu' }}
          WM_DAILY_CALL_CAP: ${{ vars.WM_DAILY_CALL_CAP || '3000' }}
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          COLLECT_FARMS: "1"
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.run

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: state-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
