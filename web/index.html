<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>European Offshore Wake Monitor</title>
<style>
:root{--bg:#eef3f4;--panel:#fff;--ink:#10252d;--mut:#5b7078;--sea:#cfe3ea;--land:#e6e2d5;--line:#b8c9cf;--acc:#0b6e8a;--uc:#b4531c;--cs:#7a5bb0;--pl:#6d7f86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a20;--panel:#12262e;--ink:#e3eef1;--mut:#8aa3ac;--sea:#0f2b36;--land:#23353a;--line:#2b4650;--acc:#5fc4e0;--uc:#f0935c;--cs:#b39cf0;--pl:#8fa4ab}}
:root[data-theme="dark"]{--bg:#0b1a20;--panel:#12262e;--ink:#e3eef1;--mut:#8aa3ac;--sea:#0f2b36;--land:#23353a;--line:#2b4650;--acc:#5fc4e0;--uc:#f0935c;--cs:#b39cf0;--pl:#8fa4ab}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
main{display:grid;grid-template-columns:1fr 330px;gap:14px;padding:14px;min-height:100vh}
@media(max-width:800px){main{grid-template-columns:1fr}}
#stage{position:relative;background:var(--sea);border-radius:10px;min-height:62vh;overflow:hidden;flex:1}canvas{width:100%;height:100%;display:block;position:absolute;inset:0;cursor:pointer}
aside{background:var(--panel);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
h1{font:600 19px/1.2 Georgia,"Times New Roman",serif;margin:0}h2{font:600 15px/1.2 Georgia,serif;margin:0}
.big{font:600 34px/1 Georgia,serif}.mut{color:var(--mut);font-size:13px}
label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}input[type=range]{width:100%;accent-color:var(--acc)}
select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}button{cursor:pointer;text-align:left}button:hover,button.on{border-color:var(--acc)}
#list{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}#list button{display:flex;justify-content:space-between;padding:5px 8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:3px 0;border-bottom:1px solid var(--line)}td+td{text-align:right;white-space:nowrap}
#leg{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;display:flex;flex-direction:column;gap:3px}#leg i{display:inline-block;width:18px;height:0;margin-right:6px;vertical-align:middle;border-top:2px solid var(--acc)}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:3px 7px;border-radius:5px;font-size:12px;display:none}

#crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}#crumb a{color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:2px}#crumb span{color:var(--mut)}
#list{max-height:300px}.est{font-style:italic}
#note{position:absolute;right:10px;top:10px;max-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;display:none}

#col{display:flex;flex-direction:column;gap:10px;min-width:0}
#tabs{display:flex;gap:6px}#tabs button{width:auto;padding:6px 14px;font-size:14px}#tabs button.on{background:var(--acc);color:var(--panel);border-color:var(--acc)}
#stage{flex:1}
#dash{display:none;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-height:62vh}
.hero{display:flex;flex-wrap:wrap;gap:22px}.hero div b{display:block;font:600 26px/1.1 Georgia,serif}.hero div span{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:9px 10px 6px;cursor:pointer;position:relative}.card:hover,.card.on{border-color:var(--acc)}
.card h3{margin:0;font:600 14px/1.2 Georgia,serif;display:flex;flex-wrap:wrap;gap:0 8px;justify-content:space-between}.card h3 span{font:13px system-ui,sans-serif;color:var(--mut)}
.card .v{font-size:13px}.card svg{display:block;width:100%;height:78px;overflow:visible}
.ax{stroke:var(--line);stroke-width:1}.ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ar{fill:var(--acc);opacity:.12}
.xh{stroke:var(--mut);stroke-width:1;stroke-dasharray:2 2}.dot{fill:var(--acc);stroke:var(--panel);stroke-width:2}
.tl{font-size:10px;fill:var(--mut)}
#ftab{width:100%;font-size:13px}#ftab th{text-align:right;font-weight:600;color:var(--mut);padding:5px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}#ftab th:first-child,#ftab th:nth-child(2){text-align:left}
#ftab td{padding:4px 6px;text-align:right;white-space:nowrap}#ftab td:first-child,#ftab td:nth-child(2){text-align:left}#ftab td:first-child{white-space:normal}#ftab tbody tr{cursor:pointer}#ftab tbody tr:hover{background:var(--bg)}
#ftab svg{width:110px;height:22px;display:block;margin-left:auto}.tw{overflow:auto;max-height:520px}
.feednote{font-size:12px;color:var(--mut);border-left:3px solid var(--acc);padding-left:8px}
#dtip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:4px 8px;border-radius:5px;font-size:12px;display:none;z-index:5}

.ln.fc{stroke-dasharray:4 3;opacity:.8}.ar.fc{opacity:.06}.nowl{stroke:var(--ink);stroke-width:1;opacity:.35}
.warn{color:var(--uc)}
:root{--wnd:#8a5a00}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wnd:#e0a33a}}:root[data-theme="dark"]{--wnd:#e0a33a}
.w .ln{stroke:var(--wnd)}.w .ar{fill:var(--wnd)}.w .dot{fill:var(--wnd)}.card svg.w{height:48px}
#ftab td:first-child{min-width:170px}#ftab svg{width:104px!important}
.arr{display:inline-block;color:var(--wnd);margin-left:4px}
#live{display:flex;gap:8px;align-items:center;justify-content:flex-start;color:var(--ink)}
</style></head><body><main>
<div id="col"><div id="tabs"><button data-t="map" class="on">Map</button><button data-t="cmp">Compare, ±24 h</button></div>
<div id="stage"><canvas id="cv"></canvas><div id="tip"></div><div id="note"></div>
<div id="leg"><span><i></i>Operating farm</span><span><i style="border-top:2px dashed var(--uc)"></i>Under construction / FID</span><span><i style="border-top:2px dashed var(--cs)"></i>Consented / in consent / leased</span><span><i style="border-top:2px dotted var(--pl)"></i>Concept or zone</span></div></div>
<div id="dash"><div class="feednote" id="fnote"></div>
<label style="justify-content:flex-start;gap:10px;max-width:420px;color:var(--ink)">Wake model <select id="FM" style="width:auto;flex:1"></select></label>
<div class="hero" id="hero"></div>
<h2>Countries <span class="mut" style="font:13px system-ui">· capacity factor (0–100%) and capacity-weighted hub-height wind (0–25 m/s), last 24 h and next 24 h forecast (dashed)</span></h2><div class="grid" id="cards"></div>
<h2 id="fh">Farms</h2><div class="tw"><table id="ftab"><thead><tr></tr></thead><tbody></tbody></table></div></div><div id="dtip"></div></div>
<aside>
<div><h1>European offshore wake monitor</h1><div id="crumb"></div><div class="mut" id="sub"></div></div>
<select id="C" aria-label="Region"></select>
<div><div class="big" id="mw">–</div><div class="mut" id="mwsub"></div></div>
<div id="mapctl"><label id="live"><input type="checkbox" id="LV"> Use forecast wind for now</label>
<div id="wif"><label>What-if wind speed <span id="uv"></span></label><input id="U" type="range" min="3" max="25" step="0.5" value="9">
<label>What-if wind from <span id="dv"></span></label><input id="D" type="range" min="0" max="359" value="270"></div>
<label>Wake field model (in browser)</label><select id="M"><option value="j">Jensen (top-hat)</option><option value="g">Bastankhah Gaussian</option><option value="n">No wake</option></select>
<label style="margin-top:8px">Wake decay k <span id="kv"></span></label><input id="K" type="range" min="0.02" max="0.08" step="0.005" value="0.04"></div>
<label style="justify-content:flex-start;gap:8px;color:var(--ink)"><input type="checkbox" id="Z" checked> Show future zones</label>
<div id="cmp"></div>
<div id="list"></div>
<div class="mut" id="foot"></div>
</aside></main>
<script>
function main(DATA,FEED){
const $=id=>document.getElementById(id),cv=$("cv"),cx=cv.getContext("2d");
const F=DATA.farms,Z=DATA.zones,S={c:null,farm:null,hover:-1,zh:-1,tab:"map",hh:-1,sort:["now",-1]};
const URG=11.5,PC=(u,R,ur)=>u<3||u>25?0:R*Math.min(1,u/(ur||URG))**3;
const CT=(u,ur)=>u<3||u>25?.05:u<=ur?.8:Math.max(.05,.8*Math.pow(ur/u,3));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=mw=>mw==null?"–":mw>=10000?(mw/1000).toFixed(1)+" GW":Math.round(mw).toLocaleString()+" MW";
const fg=mw=>mw==null?"–":mw>=1000?(mw/1000).toFixed(2)+" GW":Math.round(mw)+" MW";
F.forEach(f=>{f.lay=!!f.xy;f.inst=f.lay?f.mw*f.xy.length/2:f.cap;
 if(!f.lay){const kx=111320*Math.cos(f.lat*Math.PI/180);f.o=f.ol.map(r=>r.map((v,i)=>i%2?(v-f.lat)*110574:(v-f.lon)*kx))}});
function sum(c){return F.filter(f=>f.c===c).reduce((a,f)=>a+f.inst,0)}
const COUNTRIES=[...new Set([...F.map(f=>f.c),...Z.map(z=>z.c)])].sort((a,b)=>sum(b)-sum(a)||a.localeCompare(b));

/* ---------- in-browser wake models (map heatmap + what-if) ---------- */
function wd(m,k,j,D,ct,px,py,dx,dy){const s=(px-j[0])*dx+(py-j[1])*dy;if(s<=1||m==="n")return 0;const c=-(px-j[0])*dy+(py-j[1])*dx;
 if(m==="j"){const r=D/2+k*s;return Math.abs(c)>r?0:(1-Math.sqrt(1-ct))*(D/2/r)**2}
 const sg=k*Math.max(s,2*D)+.25*D*Math.sqrt(.5*(1+Math.sqrt(1-ct))/Math.sqrt(1-ct));let r=ct/(8*(sg/D)**2);if(r>.99)r=.99;return(1-Math.sqrt(1-r))*Math.exp(-c*c/(2*sg*sg))}
function run(f,m,U,dir,k){const t=dir*Math.PI/180,dx=-Math.sin(t),dy=-Math.cos(t);
 if(!f.lay){const free=PC(U,f.cap,URG);return{P:[],u:[],ct:[],pw:free*(m==="n"?1:.9),free,dx,dy}}
 const n=f.xy.length/2,P=[];for(let i=0;i<n;i++)P.push([f.xy[2*i],f.xy[2*i+1]]);
 const ord=P.map((p,i)=>i).sort((a,b)=>(P[a][0]*dx+P[a][1]*dy)-(P[b][0]*dx+P[b][1]*dy));
 const u=new Array(n),ct=new Array(n),done=[];
 for(const i of ord){let q=0;for(const j of done){const d=wd(m,k,P[j],f.D,ct[j],P[i][0],P[i][1],dx,dy);q+=d*d}
  u[i]=U*(1-Math.sqrt(q));ct[i]=CT(u[i],f.ur);done.push(i)}
 let pw=0;for(let i=0;i<n;i++)pw+=PC(u[i],f.mw,f.ur);return{P,u,ct,pw,free:n*PC(U,f.mw,f.ur),dx,dy}}

/* ---------- time series: pipeline feed, or synthetic fallback ---------- */
const NP=24,NF=24,NT=NP+NF,N0=NP-1; // index N0 = now
let HRS,MODELS,SRC;
if(FEED){HRS=[...FEED.hours,...FEED.fc_hours].map(s=>new Date(s.replace("Z",":00Z")));MODELS=FEED.models;SRC=FEED.source}
else{const t0=new Date();t0.setMinutes(0,0,0);HRS=[...Array(NT)].map((_,h)=>new Date(t0.getTime()+(h-N0)*3600e3));MODELS={jensen:"Jensen (in browser)",bastankhah:"Bastankhah Gaussian (in browser)",nowake:"No wake"};SRC="browser"}
F.forEach((f,i)=>{const q=FEED&&FEED.farms[String(f.id)];
 if(q){f.U48=[...q.U,...(q.fU||Array(NF).fill(null))];f.D48=[...q.dir,...(q.fdir||Array(NF).fill(null))];f.S={};for(const m in MODELS)f.S[m]=[...q.P[m],...(q.fP?q.fP[m]:Array(NF).fill(null))];return}
 let s=Math.sin((i+1)*12.9898)*43758.5453;s-=Math.floor(s);f.U48=[];f.D48=[];
 for(let h=0;h<NT;h++){f.U48.push(+Math.max(1,Math.min(24,10+5*Math.sin(2*Math.PI*(h-f.lon*1.3)/26+f.lat*.4)+1.6*Math.sin(h/3.1+f.lat*2)+(s-.5))).toFixed(1));f.D48.push(Math.round((250+60*Math.sin((h-f.lon)/9)+360)%360))}});
function browserSeries(m){const key={jensen:"j",bastankhah:"g",nowake:"n"}[m];F.forEach(f=>{f.S=f.S||{};if(f.S[m])return;f.S[m]=f.U48.map((U,h)=>run(f,key,U,f.D48[h],key==="g"?.035:.04).pw)})}
const hl=h=>HRS[h].toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),dl=h=>HRS[h].toLocaleString([],{weekday:"short",hour:"2-digit",minute:"2-digit"});
const LIVE=()=>$("LV").checked;
function curWind(f){return LIVE()&&f.U48[N0]!=null?[f.U48[N0],f.D48[N0]]:[+$("U").value,+$("D").value]}
function cur(f){const m=$("M").value,[U,D]=curWind(f),k=+$("K").value,key=m+U+"|"+D+"|"+k;if(f._k!==key){f._k=key;f._r=run(f,m,U,D,k)}return f._r}
const now=c=>F.filter(f=>!c||f.c===c).reduce((a,f)=>a+cur(f).pw,0);

/* ---------- map ---------- */
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);return[r.width,r.height]}
function draw(){if(S.tab==="cmp"){dash();sidebar();return}const[W,H]=size();cx.fillStyle=css("--sea");cx.fillRect(0,0,W,H);S.pts=[];S.zp=[];
 S.farm===null?map(W,H):farmView(W,H);sidebar();$("leg").style.display=S.farm===null?"flex":"none"}
function bbox(c){let a=[180,90,-180,-90];const add=(x,y)=>{a[0]=Math.min(a[0],x);a[1]=Math.min(a[1],y);a[2]=Math.max(a[2],x);a[3]=Math.max(a[3],y)};
 F.filter(f=>f.c===c).forEach(f=>f.ol.forEach(r=>{for(let i=0;i<r.length;i+=2)add(r[i],r[i+1])}));
 if($("Z").checked||!F.some(f=>f.c===c))Z.filter(z=>z.c===c).forEach(z=>z.r.forEach(r=>{for(let i=0;i<r.length;i+=2)add(r[i],r[i+1])}));
 const px=Math.max(.5,(a[2]-a[0])*.12),py=Math.max(.3,(a[3]-a[1])*.12);return[a[0]-px,a[1]-py,a[2]+px,a[3]+py]}
function map(W,H){const eu=S.c===null,[lo0,la0,lo1,la1]=eu?[-11,40.5,27,62.5]:bbox(S.c),c=Math.cos((la0+la1)/2*Math.PI/180),sc=Math.min(W/((lo1-lo0)*c),H/(la1-la0));
 const ox=(W-(lo1-lo0)*c*sc)/2,oy=(H-(la1-la0)*sc)/2,prj=(lo,la)=>[ox+(lo-lo0)*c*sc,oy+(la1-la)*sc];
 const pth=fl=>{const p=new Path2D();for(const r of fl){for(let i=0;i<r.length;i+=2){const[x,y]=prj(r[i],r[i+1]);i?p.lineTo(x,y):p.moveTo(x,y)}p.closePath()}return p};
 cx.fillStyle=css("--land");cx.strokeStyle=css("--line");cx.lineWidth=1;const land=pth(DATA.coast);cx.fill(land);cx.stroke(land);
 const SC={uc:["--uc",[6,4]],cs:["--cs",[6,4]],pl:["--pl",[2,3]]};
 if($("Z").checked)Z.forEach((z,i)=>{if(!eu&&z.c!==S.c)return;const p=pth(z.r),[col,d]=SC[z.s];S.zp.push([p,i]);cx.fillStyle=css(col);cx.globalAlpha=i===S.zh?.3:eu?.07:.1;cx.fill(p);cx.globalAlpha=eu?.7:1;cx.setLineDash(d);cx.strokeStyle=css(col);cx.lineWidth=i===S.zh?2.2:eu?.8:1.3;cx.stroke(p);cx.setLineDash([]);cx.globalAlpha=1});
 F.forEach(f=>{if(!eu&&f.c!==S.c)return;const p=pth(f.ol);cx.fillStyle=css("--acc");cx.globalAlpha=.2;cx.fill(p);cx.globalAlpha=1;cx.strokeStyle=css("--acc");cx.lineWidth=eu?1:1.5;cx.stroke(p)});
 F.forEach((f,i)=>{if(!eu&&f.c!==S.c)return;const r=cur(f),[x,y]=prj(f.lon,f.lat),rad=eu?2.5+Math.sqrt(f.inst)*.22:5+Math.sqrt(f.inst)*.35;
  cx.beginPath();cx.arc(x,y,rad,0,7);cx.fillStyle=css("--acc");cx.globalAlpha=.2+.6*(r.pw/Math.max(1,f.inst));cx.fill();cx.globalAlpha=1;cx.lineWidth=i===S.hover?3:1.3;cx.strokeStyle=css("--acc");if(!f.lay)cx.setLineDash([3,2]);cx.stroke();cx.setLineDash([]);S.pts.push([x,y,rad,i])})}
function farmView(W,H){const f=F[S.farm],r=cur(f),xs=r.P.map(p=>p[0]),ys=r.P.map(p=>p[1]);f.o.forEach(q=>{for(let i=0;i<q.length;i+=2){xs.push(q[i]);ys.push(q[i+1])}});const pad=f.lay?Math.max(500,f.D*4):800;
 const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad,sc=Math.min(W/(x1-x0),H/(y1-y0)),ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
 const X=x=>ox+(x-x0)*sc,Y=y=>oy+(y1-y)*sc,m=$("M").value,k=+$("K").value;
 if(f.lay&&m!=="n"){const G=[140,Math.max(20,Math.round(140*(y1-y0)/(x1-x0)))],off=document.createElement("canvas");off.width=G[0];off.height=G[1];const oc=off.getContext("2d"),im=oc.createImageData(G[0],G[1]);
  for(let gy=0;gy<G[1];gy++)for(let gx=0;gx<G[0];gx++){const px=x0+(gx+.5)/G[0]*(x1-x0),py=y1-(gy+.5)/G[1]*(y1-y0);let q=0;
   for(let j=0;j<r.P.length;j++){const d=wd(m,k,r.P[j],f.D,r.ct[j],px,py,r.dx,r.dy);q+=d*d}
   const d=Math.sqrt(q),o=4*(gy*G[0]+gx),e=Math.min(1,d*3);im.data[o]=255-16*e;im.data[o+1]=209-137*e;im.data[o+2]=102+9*e;im.data[o+3]=Math.min(1,d*3.2)*215}
  oc.putImageData(im,0,0);cx.imageSmoothingEnabled=true;cx.drawImage(off,ox,oy,(x1-x0)*sc,(y1-y0)*sc)}
 cx.strokeStyle=css("--acc");cx.lineWidth=1.8;for(const q of f.o){cx.beginPath();for(let i=0;i<q.length;i+=2)i?cx.lineTo(X(q[i]),Y(q[i+1])):cx.moveTo(X(q[i]),Y(q[i+1]));cx.closePath();if(!f.lay){cx.fillStyle=css("--acc");cx.globalAlpha=.12;cx.fill();cx.globalAlpha=1}cx.stroke()}
 r.P.forEach(p=>{cx.beginPath();cx.arc(X(p[0]),Y(p[1]),Math.max(2.5,f.D/2*sc),0,7);cx.fillStyle=css("--panel");cx.globalAlpha=.9;cx.fill();cx.globalAlpha=1;cx.strokeStyle=css("--acc");cx.lineWidth=1.2;cx.stroke()});
 const[U,D]=curWind(f),t=D*Math.PI/180,ax=46,ay=46;cx.strokeStyle=css("--ink");cx.fillStyle=css("--ink");cx.lineWidth=2;cx.beginPath();cx.moveTo(ax+Math.sin(t)*26,ay-Math.cos(t)*26);cx.lineTo(ax-Math.sin(t)*26,ay+Math.cos(t)*26);cx.stroke();
 cx.beginPath();cx.arc(ax-Math.sin(t)*26,ay+Math.cos(t)*26,5,0,7);cx.fill();cx.font="12px sans-serif";cx.fillText(U.toFixed(1)+" m/s",ax-22,ay+44);
 const bar=(x1-x0)>30000?5000:1000;cx.fillText("scale bar "+bar/1000+" km",W-110,H-16);cx.fillRect(W-110,H-12,bar*sc,2)}
function crumb(){const p=[["Europe","e"]];if(S.c)p.push([S.c,"c"]);if(S.farm!==null)p.push([F[S.farm].n,"f"]);
 $("crumb").innerHTML=p.map((q,i)=>i<p.length-1?"<a data-go='"+q[1]+"'>"+q[0]+"</a>":"<span>"+q[0]+"</span>").join("<span>›</span>")}
function sidebar(){$("uv").textContent=$("U").value+" m/s";$("dv").textContent=$("D").value+"°";$("kv").textContent=$("K").value;crumb();$("C").value=S.c||"";$("note").style.display="none";
 $("wif").style.display=LIVE()?"none":"block";$("mapctl").style.display=S.tab==="map"?"block":"none";$("list").style.display=S.tab==="map"?"flex":"none";
 const fs=F.filter(f=>!S.c||f.c===S.c),zs=Z.filter(z=>!S.c||z.c===S.c),cap=fs.reduce((a,f)=>a+f.inst,0);

  $("sub").textContent=fs.length+" operating farms · "+zs.length+" future zones";return}
 const src=LIVE()?"forecast wind":"what-if wind";

  if(S.c===null)$("list").innerHTML=COUNTRIES.map(c=>{const i=sum(c);return"<button data-c='"+c+"'><span>"+c+"</span><span class='mut'>"+(i?fmt(now(c))+" / "+fmt(i):"zones only")+"</span></button>"}).join("");

 else{const f=F[S.farm],r=cur(f),[U,D]=curWind(f);$("mw").textContent=fmt(r.pw);
  if(f.lay){$("mwsub").textContent="of "+fmt(f.inst)+" · wake loss "+(100*(1-r.pw/r.free||0)).toFixed(1)+"% · "+U.toFixed(1)+" m/s from "+D+"° at hub ("+src+")";$("sub").textContent=f.xy.length/2+" × "+f.t+" · D "+f.D+" m · hub "+f.h+" m · COD "+f.y+" · site "+f.a+" km² ("+(f.inst/f.a).toFixed(1)+" MW/km²)";
   let rows=[["Jensen","j"],["Gaussian","g"],["No wake","n"]].map(([nm,m])=>"<tr><td>"+nm+"</td><td>"+fmt(run(f,m,U,D,m==="g"?.035:.04).pw)+"</td></tr>").join("");

   $("cmp").innerHTML=h}
  else{$("mwsub").textContent="of "+fmt(f.inst)+" · estimated";$("sub").textContent="Site "+f.a+" km²";$("cmp").innerHTML="";const n=$("note");n.style.display="block";n.textContent="There are no turbine positions for this farm in the dataset, so there's no wake field. Output is the free-stream power curve with an assumed 10% wake loss."}
  $("list").innerHTML=F.map((g,i)=>g.c!==f.c?"":"<button data-i='"+i+"' class='"+(i===S.farm?"on ":"")+(g.lay?"":"est")+"'><span>"+g.n+"</span><span class='mut'>"+fmt(cur(g).pw)+"</span></button>").join("")}}
function go(c,farm){S.c=c;S.farm=farm;S.hover=-1;S.zh=-1;$("tip").style.display="none";draw()}

$("FM").innerHTML=Object.keys(MODELS).map(m=>"<option value='"+m+"'>"+MODELS[m]+"</option>").join("");$("FM").value=S.fm;
function series(){if(!FEED){browserSeries(S.fm);browserSeries("nowake")}F.forEach(f=>{f.P=f.S[S.fm];f.Fr=f.S.nowake})}
function agg(fs){const P=Array(NT).fill(null),Fr=Array(NT).fill(null);let inst=0;
 fs.forEach(f=>{inst+=f.inst;for(let h=0;h<NT;h++){if(f.P[h]!=null)P[h]=(P[h]||0)+f.P[h];if(f.lay&&f.Fr[h]!=null)Fr[h]=(Fr[h]||0)+f.Fr[h]}});return{P,inst,Fr}}
const mean=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null};
const past=a=>a.slice(0,NP),fut=a=>a.slice(NP);
function line(vals,max,W,H,pad){const x=h=>pad+(W-2*pad)*h/(NT-1),y=v=>H-2-(H-6)*Math.min(1,Math.max(0,v/max));
 const seg=(a,b)=>{let d="",on=false;for(let h=a;h<=b;h++){const v=vals[h];if(v==null){on=false;continue}d+=(on?"L":"M")+x(h).toFixed(1)+","+y(v).toFixed(1);on=true}return d};
 return{p:seg(0,N0),f:seg(N0,NT-1),x,y}}
function area(d,L,H){if(!d)return"";const m=d.match(/[ML]([\d.]+),/g);const a=m[0].slice(1,-1),b=m[m.length-1].slice(1,-1);return d+"L"+b+","+(H-2)+"L"+a+","+(H-2)+"Z"}
function chartSVG(vals,W,H,dot,g=.5,gl="50%"){const L=line(vals,1,W,H,3);
 let s="<line class='ax' x1='3' x2='"+(W-3)+"' y1='"+(H-2)+"' y2='"+(H-2)+"'/><line class='ax' stroke-dasharray='2 3' x1='3' x2='"+(W-3)+"' y1='"+L.y(g)+"' y2='"+L.y(g)+"'/><text class='tl' x='3' y='"+(L.y(g)-3)+"'>"+gl+"</text>";
 s+="<line class='nowl' x1='"+L.x(N0)+"' x2='"+L.x(N0)+"' y1='0' y2='"+H+"'/>";
 s+="<path class='ar' d='"+area(L.p,L,H)+"'/><path class='ar fc' d='"+area(L.f,L,H)+"'/><path class='ln' d='"+L.p+"'/><path class='ln fc' d='"+L.f+"'/>";
 const h=S.hh>=0?S.hh:N0;if(S.hh>=0)s+="<line class='xh' x1='"+L.x(h)+"' x2='"+L.x(h)+"' y1='0' y2='"+H+"'/>";if(dot&&vals[h]!=null)s+="<circle class='dot' r='4' cx='"+L.x(h)+"' cy='"+L.y(vals[h])+"'/>";return s}
const CO=()=>COUNTRIES.filter(c=>F.some(f=>f.c===c));
const UMAX=25;
function aggW(fs){return[...Array(NT)].map((_,h)=>{let a=0,w=0;fs.forEach(f=>{const u=f.U48[h];if(u!=null){a+=u*f.inst;w+=f.inst}});return w?a/w:null})}
const arrow=d=>d==null?"":"<span class='arr' style='transform:rotate("+d+"deg)' title='from "+d+"°'>↓</span>";
const ms=u=>u==null?"–":u.toFixed(1)+" m/s";
function dash(){series();const fs=F.filter(f=>!S.c||f.c===S.c),A=agg(fs),lay=fs.filter(f=>f.lay),fr=lay.reduce((a,f)=>a+(f.Fr[N0]||0),0),pl=lay.reduce((a,f)=>a+(f.P[N0]||0),0);
 const age=FEED?(Date.now()-new Date(FEED.generated))/36e5:0;
 $("fnote").innerHTML=FEED?("<b>Feed: "+(SRC==="synthetic"?"synthetic test wind":SRC==="openmeteo"?"Open-Meteo, "+(FEED.nwp_model||"")+" forecast":SRC==="windy"?"Windy "+(FEED.windy_model||""):"ECMWF open data")+"</b>, wake losses from PyWake. Generated "+new Date(FEED.generated).toLocaleString()+(age>3?" <span class='warn'>(more than 3 h old, the hourly job may have stopped)</span>":"")+". History "+hl(0)+" → now "+hl(N0)+", forecast to "+dl(NT-1)+".")
  :"<b>No feed.json found</b>, showing synthetic wind through the in-browser models. Run the pipeline to get PyWake results.";
 const cfN=A.P[N0]/A.inst,pv=past(A.P).filter(x=>x!=null);
 $("hero").innerHTML=[[fg(A.P[N0]),(S.c||"Europe")+" now"],[(100*cfN).toFixed(0)+"%","capacity factor now"],[fg(mean(past(A.P))),"last 24 h mean"],[fg(mean(fut(A.P))),"next 24 h mean"],[pv.length?fg(Math.min(...pv))+" – "+fg(Math.max(...pv)):"–","last 24 h range"],[ms(aggW(fs)[N0]),"mean hub-height wind now"],[fr?(100*(1-pl/fr)).toFixed(1)+"%":"–","wake loss now (farms with layouts)"]].map(q=>"<div><b>"+q[0]+"</b><span>"+q[1]+"</span></div>").join("");
 const h=S.hh>=0?S.hh:N0;
 $("cards").innerHTML=CO().map(c=>{const a=agg(F.filter(f=>f.c===c));return"<div class='card"+(c===S.c?" on":"")+"' data-c='"+c+"'><h3>"+c+"<span>"+fg(a.P[h])+" · CF "+(a.P[h]==null?"–":(100*a.P[h]/a.inst).toFixed(0)+"%")+"</span></h3><div class='v mut'>"+(h===N0?"now":dl(h))+" · last 24 h mean "+fg(mean(past(a.P)))+" of "+fg(a.inst)+"</div><svg data-c='"+c+"'></svg><div class='v mut' style='margin-top:4px'>Wind at hub "+ms(aggW(F.filter(f=>f.c===c))[h])+"</div><svg class='w' data-c='"+c+"' data-w='1'></svg></div>"}).join("");
 $("cards").querySelectorAll("svg").forEach(sv=>{const W=sv.clientWidth||200,fc=F.filter(f=>f.c===sv.dataset.c),a=agg(fc),L=line([],1,W,64,3);
  if(sv.dataset.w){sv.setAttribute("viewBox","0 0 "+W+" 48");sv.innerHTML=chartSVG(aggW(fc).map(u=>u==null?null:u/UMAX),W,46,true,11.5/UMAX,"≈ rated 11.5 m/s");return}
  sv.setAttribute("viewBox","0 0 "+W+" 78");
  sv.innerHTML=chartSVG(a.P.map(p=>p==null?null:p/a.inst),W,64,true)+"<text class='tl' x='3' y='76'>−24 h</text><text class='tl' x='"+L.x(N0)+"' y='76' text-anchor='middle'>now</text><text class='tl' x='"+(W-3)+"' y='76' text-anchor='end'>+24 h</text>"});
 $("fh").textContent=(S.c?S.c+" farms":"All farms")+" ("+fs.length+")";
 const rows=fs.map(f=>({f,i:F.indexOf(f),now:f.P[N0],cf:f.P[N0]==null?null:f.P[N0]/f.inst,wl:f.lay&&f.Fr[N0]?1-f.P[N0]/f.Fr[N0]:null,avg:mean(past(f.P)),nx:mean(fut(f.P)),u:f.U48[N0]}));
 const[k,dirn]=S.sort,val=r=>k==="n"?r.f.n:k==="c"?r.f.c:k==="inst"?r.f.inst:r[k]??-1;rows.sort((a,b)=>{const x=val(a),y=val(b);return(typeof x==="string"?x.localeCompare(y):x-y)*dirn});
 const cols=[["n","Farm"],["c","Country"],["inst","Installed"],["now","Now"],["cf","CF now"],["wl","Wake loss"],["u","Wind now"],["sp","Output ±24 h"],["sw","Wind ±24 h"],["avg","Last 24 h"],["nx","Next 24 h"]];
 $("ftab").tHead.rows[0].innerHTML=cols.map(q=>"<th data-k='"+q[0]+"'>"+q[1]+(S.sort[0]===q[0]?(S.sort[1]>0?" ▲":" ▼"):"")+"</th>").join("");
 $("ftab").tBodies[0].innerHTML=rows.map(r=>{const L=line(r.f.P.map(p=>p==null?null:p/r.f.inst),1,104,22,2);return"<tr data-i='"+r.i+"' class='"+(r.f.lay?"":"est")+"'><td>"+r.f.n+"</td><td>"+r.f.c+"</td><td>"+fmt(r.f.inst)+"</td><td>"+fmt(r.now)+"</td><td>"+(r.cf==null?"–":(100*r.cf).toFixed(0)+"%")+"</td><td>"+(r.wl==null?"–":Math.max(0,100*r.wl).toFixed(1)+"%")+"</td><td>"+ms(r.u)+arrow(r.f.D48[N0])+"</td><td><svg viewBox='0 0 104 22' data-i='"+r.i+"'><line class='nowl' x1='"+L.x(N0)+"' x2='"+L.x(N0)+"' y1='0' y2='22'/><path class='ln' style='stroke-width:1.5' d='"+L.p+"'/><path class='ln fc' style='stroke-width:1.5' d='"+L.f+"'/></svg></td><td>"+(()=>{const W=line(r.f.U48.map(u=>u==null?null:u/UMAX),1,104,22,2);return"<svg class='w' viewBox='0 0 104 22' data-i='"+r.i+"' data-w='1'><line class='nowl' x1='"+W.x(N0)+"' x2='"+W.x(N0)+"' y1='0' y2='22'/><path class='ln' style='stroke-width:1.5' d='"+W.p+"'/><path class='ln fc' style='stroke-width:1.5' d='"+W.f+"'/></svg>"})()+"</td><td>"+fmt(r.avg)+"</td><td>"+fmt(r.nx)+"</td></tr>"}).join("")}
function tab(t){S.tab=t;if(t==="cmp")S.farm=null;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 $("stage").style.display=t==="map"?"block":"none";$("dash").style.display=t==="cmp"?"flex":"none";draw()}
function hourAt(sv,e,pad){const r=sv.getBoundingClientRect(),vb=sv.viewBox.baseVal,x=(e.clientX-r.left)/r.width*vb.width;return Math.max(0,Math.min(NT-1,Math.round((x-pad)/(vb.width-2*pad)*(NT-1))))}
function dtip(e,t){const d=$("dtip");d.style.display="block";d.textContent=t;d.style.left=Math.min(e.clientX+12,innerWidth-260)+"px";d.style.top=e.clientY+14+"px"}

/* ---------- events ---------- */
$("C").innerHTML="<option value=''>Europe</option>"+COUNTRIES.map(c=>"<option>"+c+"</option>").join("");$("C").onchange=()=>go($("C").value||null,null);

["U","D","K"].forEach(i=>$(i).oninput=draw);$("M").onchange=()=>{$("K").value=$("M").value==="g"?.035:.04;draw()};$("Z").onchange=draw;$("LV").onchange=draw;
$("FM").onchange=()=>{S.fm=$("FM").value;draw()};
function hit(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let b=-1,bd=1e9;S.pts.forEach(p=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<p[2]+6&&d<bd){bd=d;b=p[3]}});
 let zh=-1;if(b<0){const d=devicePixelRatio||1;cx.save();cx.setTransform(1,0,0,1,0,0);for(const[p,i]of S.zp)if(cx.isPointInPath(p,x*d,y*d)&&(zh<0||Z[i].a<Z[zh].a))zh=i;cx.restore()}return[b,zh,x,y]}
cv.onclick=e=>{if(S.farm!==null)return;const[b]=hit(e);if(b>=0)go(F[b].c,b)};
cv.onmousemove=e=>{if(S.farm!==null)return;const[b,zh,x,y]=hit(e);if(b!==S.hover||zh!==S.zh){S.hover=b;S.zh=zh;draw()}const t=$("tip");
 if(b>=0||zh>=0){t.style.display="block";t.style.left=Math.min(x+12,cv.clientWidth-260)+"px";t.style.top=y+12+"px";
  if(b>=0){const f=F[b],[U,D]=curWind(f);t.textContent=f.n+" ("+f.c+") · "+fmt(cur(f).pw)+(f.lay?"":" (est.)")+" · "+U.toFixed(1)+" m/s from "+D+"°"}else{const z=Z[zh];t.textContent=z.n+" ("+z.c+") · "+z.st+(z.mw>=5?" · "+fmt(z.mw):"")+" · "+z.a+" km²"}}else t.style.display="none"};
cv.onmouseleave=()=>{$("tip").style.display="none"};

$("cards").onmousemove=e=>{const sv=e.target.closest("svg");if(!sv){if(S.hh>=0){S.hh=-1;dash()}$("dtip").style.display="none";return}const h=hourAt(sv,e,3);
 if(h!==S.hh){S.hh=h;dash()}const fc=F.filter(f=>f.c===sv.dataset.c),a=agg(fc);dtip(e,sv.dataset.c+" · "+dl(h)+(h>N0?" (forecast)":"")+" · "+fg(a.P[h])+(a.P[h]==null?"":" · CF "+(100*a.P[h]/a.inst).toFixed(0)+"%")+" · wind "+ms(aggW(fc)[h]))};
$("cards").onmouseleave=()=>{S.hh=-1;$("dtip").style.display="none";dash()};
$("ftab").onmousemove=e=>{const sv=e.target.closest("svg");if(!sv){$("dtip").style.display="none";return}const f=F[+sv.dataset.i],h=hourAt(sv,e,2);
 dtip(e,f.n+" · "+dl(h)+(h>N0?" (forecast)":"")+" · "+fmt(f.P[h])+(f.P[h]==null?"":" · CF "+(100*f.P[h]/f.inst).toFixed(0)+"%")+(f.U48[h]!=null?" · "+f.U48[h].toFixed(1)+" m/s from "+f.D48[h]+"°":""))};

$("LV").checked=!!FEED;
$("foot").innerHTML="Map: in-browser Jensen/Gaussian on "+(FEED?"the forecast wind (or what-if sliders)":"what-if wind")+". Compare: "+(FEED?"PyWake results from feed.json.":"in-browser models on synthetic wind.")+(FEED&&SRC==="openmeteo"?" <a href='https://open-meteo.com/' style='color:inherit'>Weather data by Open-Meteo.com</a> (CC BY 4.0).":"")+" Generic power curve P ∝ U³ up to each turbine's rated speed. <i>Italic</i> farms have no turbine layout in the dataset, so their output is the free-stream power curve minus an assumed 10% wake loss.<br><br><b>Disclaimer:</b> all figures are model estimates, not measured output, and not advice of any kind. Personal non-commercial project, not affiliated with any wind farm, operator or data provider.<br><br>Turbine data: <a href='https://doi.org/10.5281/zenodo.17311571' style='color:inherit'>EuroWindWakes European Offshore Dataset</a> contributors, © OpenStreetMap contributors, EMODnet (ODbL). Farm outlines: own compilation, partly from EMODnet Human Activities. Coastlines: Natural Earth. Wake models: PyWake (DTU).";

}
