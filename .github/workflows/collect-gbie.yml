name: collect-gbie

# Great Britain (Elexon BMRS) and Ireland (EirGrid load) into the data store; no keys needed (collector/gbie.py).
#   daily     12:50 UTC: last 4 days
#   backfill  every 2 h: whole months from BACKFILL_FROM, newest first, until done (state in gbie_state.json)
on:
  schedule:
    - cron: "50 12 * * *"
    - cron: "20 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or backfill"
        default: daily

permissions:
  contents: write   # upload release assets

# same lock as the ENTSO-E collector and the metrics job: they write the same monthly assets
concurrency:
  group: store-entsoe
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6   # uv installs the requirements in seconds (pip took ~30 s)
        with:
          enable-cache: false
      - run: uv pip install --system -r requirements-collect.txt
      - name: Collect GB and Ireland
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL_FROM: ${{ vars.BACKFILL_FROM || '2024-01' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '50 12 * * *' && 'daily' || 'backfill') }}
        run: python -m collector.gbie "$MODE"
