name: extra-turbines

# Manual: fetch farms missing from the turbine database from OpenStreetMap, rebuild site.json, commit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_osm_turbines.py]   # runs when the presets change

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6   # uv installs the requirements in seconds (pip took ~30 s)
        with:
          enable-cache: false
      - run: uv pip install --system requests shapely
      - run: python scripts/fetch_osm_turbines.py
      - run: python scripts/build_site.py
      - name: Commit
        run: |
          git config user.name "wake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/extra_turbines_log.txt
          git add data/raw/extra_turbines.csv web/data/site.json 2>/dev/null || true
          git commit -m "Add extra turbines from OpenStreetMap" || echo "no changes"
          git push
